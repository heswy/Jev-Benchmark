<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Score, API time and cost for seven benchmarked models</title>
<desc id="desc">Aligned comparison of equal-weight accuracy, median observed API latency and CNY cost per thousand attempts.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b} .muted{fill:#64748b}.grid{stroke:#dbe2ea;stroke-width:1}.blue{fill:#3062c4}.orange{fill:#b76027}.thin{stroke:#1e293b;stroke-width:2}</style>
<text x="28" y="39" font-size="25" font-weight="700">Score · time · cost</text>
<text x="28" y="64" font-size="13" class="muted">Same 1,050 attempts per model; all rows use the same task mix</text>
