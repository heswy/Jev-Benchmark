<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 502" role="img" aria-labelledby="title desc">
<title id="title">Benchmark accuracy and paired uncertainty</title>
<desc id="desc">Five-dataset equal-weight accuracy for seven models. Right panel shows each candidate minus Jev with paired 95% bootstrap intervals.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#1e293b} .muted{fill:#64748b}.grid{stroke:#dbe2ea;stroke-width:1}.blue{fill:#3062c4}.orange{fill:#b76027}.thin{stroke:#1e293b;stroke-width:2}</style>
<text x="32" y="41" font-size="25" font-weight="700">Five-dataset accuracy</text>
<text x="32" y="64" font-size="13" class="muted">End-to-end; equal dataset weights; 1,050 items per model</text>
