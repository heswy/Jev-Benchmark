<text x="196.0" y="89" font-size="11" text-anchor="middle" class="muted">0%</text>
<line x1="296.0" y1="96" x2="296.0" y2="430" class="grid"/>
<text x="296.0" y="89" font-size="11" text-anchor="middle" class="muted">25%</text>
